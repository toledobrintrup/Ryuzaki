<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RYUZAKI — Intelligence System</title>
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('ryu-theme')||'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- BOOT SCREEN -->
  <div id="boot" class="boot">
    <div class="boot-inner">
      <div class="boot-mark">
        <svg class="ry-mark" viewBox="0 0 48 48" fill="none" aria-label="Ryuzaki">
          <path class="cm" d="M7 14V7H14 M34 7H41V14 M7 34V41H14 M41 34V41H34"/>
          <rect class="gl" x="16" y="12" width="6.2" height="22" rx="1"/>
          <rect class="gl" x="16" y="27.8" width="15.5" height="6.2" rx="1"/>
          <rect class="cr" x="34.5" y="26.5" width="6.2" height="7.5" rx="1"/>
        </svg>
      </div>
      <div class="boot-word"><span id="boot-type"></span><i class="wm-caret"></i></div>
      <div class="boot-sub"><b>強</b> · INTELLIGENCE SYSTEM</div>
      <div class="boot-bar"><span id="boot-fill"></span></div>
      <div class="boot-status" id="boot-status">INICIANDO SISTEMA…</div>
    </div>
  </div>

  <div class="dotgrid"></div>
  <div class="noise"></div>

  <div class="app" id="app">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="logo" data-nav="dashboard">
        <div class="logo-mark">
          <svg class="ry-mark" viewBox="0 0 48 48" fill="none" aria-label="Ryuzaki">
            <path class="cm" d="M7 14V7H14 M34 7H41V14 M7 34V41H14 M41 34V41H34"/>
            <rect class="gl" x="16" y="12" width="6.2" height="22" rx="1"/>
            <rect class="gl" x="16" y="27.8" width="15.5" height="6.2" rx="1"/>
            <rect class="cr" x="34.5" y="26.5" width="6.2" height="7.5" rx="1"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-word">RYUZAKI<i class="wm-caret"></i></div>
          <div class="logo-sub"><b>強</b> · INTELLIGENCE SYSTEM</div>
        </div>
      </div>

      <nav class="nav" id="nav"></nav>

      <div class="sidebar-foot">
        <div class="syscard">
          <div class="syscard-row"><span>CPU MENTAL</span><b id="sys-cpu">62%</b></div>
          <div class="syscard-bar"><i style="width:62%"></i></div>
          <div class="syscard-row"><span>FOCO</span><b id="sys-focus">ALTO</b></div>
          <div class="syscard-row"><span>UPTIME</span><b id="sys-uptime">—</b></div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="menu">☰</button>
          <div class="crumb"><span id="crumb-section">DASHBOARD</span></div>
        </div>
        <div class="topbar-right">
          <div class="readout"><label>CLP/USD</label><span id="ro-usd">$ 945,30</span></div>
          <div class="readout"><label>PUERTO VARAS</label><span id="ro-weather">8° ☁</span></div>
          <div class="readout time"><label id="ro-date">—</label><span id="ro-clock">--:--:--</span></div>
          <button class="theme-toggle" id="theme-toggle" aria-label="tema">☾</button>
        </div>
      </header>

      <section class="view" id="view"></section>

      <div class="ticker">
        <div class="ticker-track" id="ticker"></div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
